name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viserion Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Single Extension (Debug)
        run: |
          # 1. Guarda a tua extensão numa pasta temporária fora da estrutura
          mkdir -p /tmp/megahentai_custom
          cp -r src/pt/megahentai/* /tmp/megahentai_custom/

          # 2. Clona o repositório oficial diretamente para a raiz do workspace
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git .

          # 3. Restaura os teus ficheiros na localização correta do projeto oficial
          mkdir -p src/pt/megahentai/
          cp -r /tmp/megahentai_custom/* src/pt/megahentai/

          # 4. Compila apenas a tua extensão em Debug
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug

          # 5. Copia o APK gerado para a raiz para o upload encontrar
          find src/pt/megahentai/build/outputs/apk/ -name "*.apk" -exec cp {} ./ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: '*.apk'
          
