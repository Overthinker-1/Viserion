name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viserion Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Import Keiyoushi Build Infrastructure
        run: |
          # Clona a base oficial para uma pasta temporária
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git /tmp/keiyoushi_base
          
          # Copia os ficheiros e pastas essenciais de compilação para a raiz do Viserion
          cp /tmp/keiyoushi_base/common.gradle ./
          cp /tmp/keiyoushi_base/settings.gradle ./
          cp -r /tmp/keiyoushi_base/build-logic ./
          cp -r /tmp/keiyoushi_base/gradle ./
          cp /tmp/keiyoushi_base/gradlew ./
          chmod +x gradlew

      - name: Build MegaHentai Debug APK
        run: |
          ./gradlew :src:pt:megahentai:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: 'src/pt/megahentai/build/outputs/apk/debug/*.apk'
          
