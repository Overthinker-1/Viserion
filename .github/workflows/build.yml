name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viserion Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MegaHentai Debug APK
        run: |
          # 1. Clona a base oficial da Keiyoushi para uma pasta dedicada
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git keiyoushi_base
          
          # 2. Copia a pasta da tua extensão do MegaHentai para dentro da estrutura oficial
          mkdir -p keiyoushi_base/src/pt/megahentai/
          cp -r src/pt/megahentai/* keiyoushi_base/src/pt/megahentai/
          
          # 3. Entra na pasta oficial e compila lá dentro (o rootDir reconhece o common.gradle nativamente)
          cd keiyoushi_base
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug
          
          # 4. Copia o APK gerado para a raiz do workspace para o upload o detetar
          find src/pt/megahentai/build/outputs/apk/ -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: '*.apk'
          
