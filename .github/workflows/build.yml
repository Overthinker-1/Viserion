name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Single Extension (Debug)
        run: |
          # Clona o repositório base oficial
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git temp_repo
          
          # Copia a pasta da tua extensão para a estrutura clonada
          mkdir -p temp_repo/src/pt/megahentai/
          cp -r src/pt/megahentai/* temp_repo/src/pt/megahentai/
          
          # Compila o MegaHentai em modo Debug
          cd temp_repo
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug
          
          # Copia o APK gerado para a raiz
          find . -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: '*.apk'
          
