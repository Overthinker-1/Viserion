name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Single Extension (Debug)
        run: |
          # Clona o repositório base oficial de forma rápida
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git temp_repo
          
          # Copia a tua extensão para dentro da estrutura clonada
          mkdir -p temp_repo/src/pt/megahentai/
          cp -r src/pt/megahentai/* temp_repo/src/pt/megahentai/
          
          # Compila APENAS a tua extensão em modo Debug (sem exigir chaves de assinatura)
          cd temp_repo
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug
          
          # Copia o APK gerado para a raiz
          find src/pt/megahentai/build/outputs/apk/ -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MegaHentai-APK
          path: '*.apk'
          
