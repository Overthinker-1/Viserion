name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viserion Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject Extension & Build APK
        run: |
          # 1. Clona a base oficial da Keiyoushi
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git keiyoushi_base
          
          # 2. Copia a tua extensão para a estrutura oficial
          mkdir -p keiyoushi_base/src/pt/megahentai/
          cp -r src/pt/megahentai/* keiyoushi_base/src/pt/megahentai/
          
          # 3. Adiciona explicitamente a extensão ao settings.gradle.kts para o Gradle reconhecer a task
          echo 'include(":src:pt:megahentai")' >> keiyoushi_base/settings.gradle.kts
          
          # 4. Compila o APK da extensão em modo Debug
          cd keiyoushi_base
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug --stacktrace
          
          # 5. Copia o APK gerado para a raiz do espaço de trabalho
          find src/pt/megahentai/build/outputs/apk/ -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: '*.apk'
          
