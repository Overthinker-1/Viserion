name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Extension Automatically
        run: |
          # Clona uma base de extensões oficial e estável
          git clone https://github.com/keiyoushi/extensions-source.git temp_repo
          
          # Garante que a pasta de destino existe e copia o teu ficheiro MegaHentai.kt para lá
          mkdir -p temp_repo/src/pt/megahentai/
          cp src/pt/megahentai/MegaHentai.kt temp_repo/src/pt/megahentai/
          
          # Entra na pasta do projeto base e compila a tua extensão específica
          cd temp_repo
          ./gradlew :src:pt:megahentai:assembleDebug
          
          # Copia o APK gerado para a pasta principal
          find . -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: megahentai-apk
          path: '*.apk'
          
