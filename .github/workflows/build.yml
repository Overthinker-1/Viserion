name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viserion Repo
        uses: actions/checkout@v4

      - name: Save MegaHentai files temporarily
        run: |
          mkdir -p /tmp/ext
          cp -r src/pt/megahentai/* /tmp/ext/

      - name: Clone Keiyoushi Base to Workspace Root
        run: |
          # Remove os ficheiros antigos do Viserion e clica a Keiyoushi diretamente na raiz (.)
          rm -rf .git src
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git .

      - name: Inject MegaHentai Extension
        run: |
          mkdir -p src/pt/megahentai/
          cp -r /tmp/ext/* src/pt/megahentai/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MegaHentai Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: 'src/pt/megahentai/build/outputs/apk/debug/*.apk'
          
