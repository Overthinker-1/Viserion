name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Viserion Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MegaHentai Debug APK (Isolated)
        run: |
          # 1. Clona a base oficial da Keiyoushi
          git clone --depth 1 https://github.com/keiyoushi/extensions-source.git keiyoushi_base
          
          # 2. Copia a tua extensão para a estrutura oficial
          mkdir -p keiyoushi_base/src/pt/megahentai/
          cp -r src/pt/megahentai/* keiyoushi_base/src/pt/megahentai/
          
          # 3. Entra na pasta e configura o settings.gradle.kts para carregar APENAS o MegaHentai
          cd keiyoushi_base
          
          # Desativa o carregamento em massa e ativa o carregamento isolado da tua extensão
          sed -i 's/loadAllIndividualExtensions()/\/\/ loadAllIndividualExtensions()\n    loadIndividualExtension("pt", "megahentai")/' settings.gradle.kts
          
          # 4. Compila utilizando a task de Debug padrão (agora direcionada apenas para a tua extensão isolada)
          chmod +x gradlew
          ./gradlew assembleDebug
          
          # 5. Copia o APK gerado para a raiz do workspace para o upload o encontrar
          find src/pt/megahentai/build/outputs/apk/ -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: '*.apk'
          
