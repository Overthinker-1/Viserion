name: Build Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Keiyoushi Extensions Source
        uses: actions/checkout@v4

      - name: Checkout User Viserion Repo (Custom Extension)
        uses: actions/checkout@v4
        with:
          repository: 0verthinker-1/Viserion
          token: ${{ secrets.GITHUB_TOKEN }}
          path: user_extension

      - name: Inject MegaHentai Extension
        run: |
          mkdir -p src/pt/megahentai/
          cp -r user_extension/src/pt/megahentai/* src/pt/megahentai/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build MegaHentai Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :src:pt:megahentai:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaHentai-APK
          path: 'src/pt/megahentai/build/outputs/apk/debug/*.apk'
          
